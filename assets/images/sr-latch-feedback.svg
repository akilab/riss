<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="title desc"><title id="title">ORとNOTを交差接続したNOR型RSラッチ</title><desc id="desc">R=0、S=0、Q=0、反転側出力Qバー=1。上の出力は下の入力、下の出力は上の入力へ戻る。交差点ではつながらない。</desc><style>text{font:22px Meiryo,sans-serif;fill:#172d45}.sr-number{font:bold 24px Consolas,monospace}.gate-shape{fill:#fff;stroke:#172d45;stroke-width:2}.signal-wire{fill:none;stroke:#53667b;stroke-width:3;stroke-dasharray:7 5}.signal-wire[data-signal="1"]{stroke:#165db5;stroke-width:5;stroke-dasharray:none}.sr-junction{fill:#172d45}</style><rect width="640" height="430" fill="#f5f8fc"/><path class="signal-wire" data-signal="0" d="M105 90H228"/><path class="signal-wire" data-signal="0" d="M105 350H228"/><path class="signal-wire" data-signal="1" d="M320 110H380"/><path class="signal-wire" data-signal="0" d="M320 330H380"/><path class="signal-wire" data-signal="0" d="M466 110H540 M495 110V185L175 270V310H228"/><path class="signal-wire" data-signal="1" d="M466 330H540 M495 330V255L175 170V130H228"/><circle class="sr-junction" cx="495" cy="110" r="5"/><circle class="sr-junction" cx="495" cy="330" r="5"/><path class="gate-shape" d="M220 70Q280 65 320 110Q280 155 220 150Q246 110 220 70Z"/><path class="gate-shape" d="M380 70L448 110L380 150Z"/><circle class="gate-shape" cx="457" cy="110" r="9"/><path class="gate-shape" d="M220 290Q280 285 320 330Q280 375 220 370Q246 330 220 290Z"/><path class="gate-shape" d="M380 290L448 330L380 370Z"/><circle class="gate-shape" cx="457" cy="330" r="9"/><text x="267" y="118" text-anchor="middle">OR</text><text x="407" y="118" text-anchor="middle">NOT</text><text x="267" y="338" text-anchor="middle">OR</text><text x="407" y="338" text-anchor="middle">NOT</text><text x="50" y="46">入力</text><text x="537" y="46">出力</text><text x="182" y="407">出力を相手の入力へ戻す</text><text class="sr-number" x="35" y="98">R=0</text><text class="sr-number" x="35" y="358">S=0</text><text class="sr-number" x="346" y="94">1</text><text class="sr-number" x="346" y="314">0</text><text class="sr-number" x="550" y="118">Q=0</text><text class="sr-number" x="550" y="338">Q̅=1</text><text class="sr-number" x="182" y="121">1</text><text class="sr-number" x="182" y="302">0</text></svg>