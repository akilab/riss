<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-labelledby="title desc">
  <title id="title">DMAなしとDMAありのデータの運び方</title><desc id="desc">DMAなしでは、SSDなどの入出力装置から主記憶へのデータをCPUが1つずつ中継する。DMAありでは、CPUが運ぶ範囲を指示すると、DMAコントローラが入出力装置から主記憶へデータを直接運ぶ。その間CPUはほかの処理を進め、運び終わると割込みで知らされる。</desc>
  <rect width="680" height="400" rx="12" fill="#f5f8fc"/>
  <g stroke="#172d45" stroke-width="2" fill="white"><rect x="20" y="50" width="180" height="64" rx="8"/><rect x="250" y="50" width="180" height="64" rx="8"/><rect x="480" y="50" width="180" height="64" rx="8"/><rect x="20" y="210" width="180" height="64" rx="8"/><rect x="250" y="210" width="180" height="64" rx="8"/><rect x="480" y="210" width="180" height="64" rx="8"/><rect x="250" y="330" width="180" height="56" rx="8"/></g>
  <path d="M20 160H660" stroke="#d4deea" stroke-width="2"/>
  <g fill="none" stroke="#172d45" stroke-width="3" stroke-linejoin="round"><path d="M200 82H245M235 74L245 82L235 90M430 82H475M465 74L475 82L465 90"/><path d="M200 242H245M235 234L245 242L235 250M430 242H475M465 234L475 242L465 250"/></g>
  <g fill="none" stroke="#a35200" stroke-width="3" stroke-dasharray="7 5" stroke-linejoin="round"><path d="M300 328V280M292 290L300 280L308 290"/><path d="M380 276V324M372 314L380 324L388 314"/></g>
  <g fill="#172d45" font-family="Meiryo, sans-serif" text-anchor="middle">
    <text x="20" y="32" font-size="20" font-weight="700" text-anchor="start">DMAなし：CPUがデータを中継する</text>
    <text x="110" y="78" font-size="19" font-weight="700">SSDなど</text><text x="110" y="102" font-size="15">入出力装置</text>
    <text x="340" y="78" font-size="19" font-weight="700">CPU</text><text x="340" y="102" font-size="15">1つずつ受け取って書く</text>
    <text x="570" y="78" font-size="19" font-weight="700">主記憶</text><text x="570" y="102" font-size="15">データの置き場所</text>
    <text x="340" y="142" font-size="16">運び終わるまで、CPUはほかの処理を進めにくい</text>
    <text x="20" y="192" font-size="20" font-weight="700" text-anchor="start">DMAあり：DMAコントローラが直接運ぶ</text>
    <text x="110" y="238" font-size="19" font-weight="700">SSDなど</text><text x="110" y="262" font-size="15">入出力装置</text>
    <text x="340" y="238" font-size="19" font-weight="700">DMAコントローラ</text><text x="340" y="262" font-size="15">② データを直接運ぶ</text>
    <text x="570" y="238" font-size="19" font-weight="700">主記憶</text><text x="570" y="262" font-size="15">データの置き場所</text>
    <text x="340" y="356" font-size="19" font-weight="700">CPU</text><text x="340" y="378" font-size="15">運ぶ間はほかの処理</text>
    <text x="292" y="310" font-size="15" text-anchor="end">① 運ぶ範囲を指示</text>
    <text x="388" y="310" font-size="15" text-anchor="start">③ 終わったら割込み</text>
  </g>
</svg>
