<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" aria-labelledby="title desc"><title id="title">記憶場所の役割と階層</title><desc id="desc">レジスタ、キャッシュ、主記憶、SSDやHDDの順に一般に容量が大きくなり、CPUから読む時間が長くなる。レジスタは計算中の値、キャッシュは一部のコピー、主記憶は実行中の命令やデータ、SSDやHDDは長期保存。</desc><style>text{font:20px Meiryo,sans-serif;fill:#172d45}rect{fill:#fff;stroke:#73869e;stroke-width:1.5}.name{font-weight:bold}.note{font-size:17px}</style><rect width="680" height="330" fill="#f5f8fc" stroke="none"/><rect x="16" y="12" width="648" height="58" rx="6"/><text class="name" x="32" y="48">レジスタ</text><text x="198" y="48">CPU内で計算中の値などを保持</text><rect x="16" y="82" width="648" height="58" rx="6"/><text class="name" x="32" y="118">キャッシュ</text><text x="198" y="118">主記憶の一部のコピーを保持</text><rect x="16" y="152" width="648" height="58" rx="6"/><text class="name" x="32" y="188">主記憶</text><text x="198" y="188">実行中の命令やデータを保持</text><rect x="16" y="222" width="648" height="58" rx="6"/><text class="name" x="32" y="258">SSD・HDD</text><text x="198" y="258">ファイルやプログラムを長期保存</text><text class="note" x="32" y="314">下の段ほど、一般に容量が大きく、CPUから読む時間が長い</text></svg>