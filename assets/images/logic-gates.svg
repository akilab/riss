<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-labelledby="title desc">
  <title id="title">論理ゲートの記号</title><desc id="desc">ANDは左が平らで右が丸い形。ORは入力側が曲線。XORはORの入力側にもう1本の曲線。NOTは三角と反転の丸。NANDはANDと反転の丸。</desc>
  <rect width="680" height="400" rx="12" fill="#f5f8fc"/>
  <g fill="none" stroke="#172d45" stroke-width="3" stroke-linejoin="round">
    <path d="M50 65H100M50 105H100M100 45H150C220 45 220 125 150 125H100Z M203 85H260"/>
    <path d="M370 65H430M370 105H430M420 45Q485 40 535 85Q485 130 420 125Q452 85 420 45Z M535 85H600"/>
    <path d="M50 220H115M50 260H115M100 200Q165 195 215 240Q165 285 100 280Q132 240 100 200Z M87 200Q119 240 87 280 M215 240H260"/>
    <path d="M370 240H420M420 200L520 240L420 280Z M538 240H600"/><circle cx="529" cy="240" r="9"/>
    <path d="M50 345H100M50 375H100M100 325H150C220 325 220 395 150 395H100Z M221 360H260"/><circle cx="212" cy="360" r="9"/>
  </g>
  <g fill="#172d45" font-family="Meiryo, sans-serif" font-size="20" font-weight="700"><text x="130" y="25">AND</text><text x="452" y="25">OR</text><text x="132" y="180">XOR</text><text x="450" y="180">NOT</text><text x="300" y="365">NAND：出力の丸は反転</text></g>
</svg>
